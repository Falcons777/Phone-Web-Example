<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contact.css">
    <title>Contact - Phone Web</title>
</head>
<body>

    <!--Contact Html-->

<header>
    <h1>Kontakt - Phone Web</h1>
</header>

<div class="container">
    <h2>Na Kontaktoni</h2>
    <p class="text">Nëse keni ndonjë pyetje, mos kryerje te pageses, sugjerim, ose ndihmë në lidhje me telefonat, mos hezitoni të na kontaktoni. Plotësoni formularin më poshtë dhe ne do t'ju përgjigjemi sa më shpejt që të jetë e mundur.</p>

    <form class="contact-form">
        <input type="text" id="name" name="name" placeholder="Emri i Plotë" required>
        <input type="email" id="email" name="email" placeholder="Email" required>
        <textarea id="message" name="message" placeholder="Mesazhi juaj..." required></textarea>
        <button type="submit" onclick="alert('Mesazhi eshte derguar me sukses.')">Dërgo</button>
    </form>
</div>

<div class="footer">
    <p>&copy; 2025 Phone Web. All rights reserved.</p>
</div>

</body>
</html>
